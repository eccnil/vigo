[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:dockerd]
command=dockerd --host=tcp://0.0.0.0:2375 --host=unix:///var/run/docker.sock
autostart=true
autorestart=true
stderr_logfile=/var/log/dockerd.err.log
stdout_logfile=/var/log/dockerd.out.log

[program:nvim]
command=nvim --headless --listen 0.0.0.0:7777
autostart=true
autorestart=true
stderr_logfile=/var/log/nvim.err.log
stdout_logfile=/var/log/nvim.out.log
